<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGAP Remote</title>
<style>
  :root { --bg:#fafaf7; --card:#fff; --ink:#1c1c1a; --muted:#6b6b66; --line:#dcdcd4; --accent:#2f6f4f; --stop:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161614; --card:#1f1f1c; --ink:#ece9e2; --muted:#9a9a92; --line:#33332e; --accent:#6fbf93; --stop:#e0554c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px 16px 40px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:.9rem; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  h2 { font-size:.95rem; margin:0 0 10px; }
  button, input { font:inherit; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); padding:10px 12px; }
  button { cursor:pointer; min-height:44px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #stop { width:100%; background:var(--stop); border-color:var(--stop); color:#fff; font-size:1.2rem; font-weight:700; min-height:64px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; }
  .grid button small { display:block; color:var(--muted); font-size:.72rem; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row input { flex:1; min-width:140px; }
  #state { font-size:.9rem; }
  #log { font:12px/1.4 ui-monospace, monospace; color:var(--muted); max-height:160px; overflow:auto; white-space:pre-wrap; margin:0; }
  .err { color:var(--stop); }
</style>
</head>
<body>
<main>
  <h1>AGAP Remote</h1>
  <p class="sub" id="state">Enter the token printed by the bridge.</p>

  <section id="login">
    <div class="row">
      <input type="password" id="token" placeholder="Token" aria-label="Bridge token" autocomplete="off">
      <button class="primary" id="connect">Connect</button>
    </div>
  </section>

  <div id="app" hidden>
    <button id="stop" aria-label="Emergency stop: release everything">STOP</button>

    <section style="margin-top:14px">
      <h2>Play a chord</h2>
      <div class="grid" id="chords"></div>
      <div class="row" style="margin-top:10px">
        <button id="down">Strum down</button><button id="up">Strum up</button><button id="releaseAll">Release all</button>
      </div>
    </section>

    <section>
      <h2>Sequence</h2>
      <div class="row">
        <input type="text" id="seq" value="C G Am F" aria-label="Chords separated by spaces" autocomplete="off">
        <input type="number" id="bpm" value="50" min="20" max="200" style="max-width:90px" aria-label="Beats per minute">
        <button class="primary" id="play">Play</button>
      </div>
    </section>

    <section>
      <h2>Board output</h2>
      <pre id="log" aria-live="polite"></pre>
    </section>
  </div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = "", timer = null;

  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }
  function say(msg, bad) { $("state").textContent = msg; $("state").className = "sub" + (bad ? " err" : ""); }
  function send(body) { return api("POST", "/api/command", body).then(function () { say("Sent: " + body.action); refresh(); }).catch(function (e) { say(e.message, true); }); }

  function refresh() {
    api("GET", "/api/status").then(function (s) {
      if (!s.connected) say("Bridge lost the serial link to the board.", true);
      else say(s.busy ? "Busy - STOP cancels." : "Ready.");
      var g = $("chords");
      if (s.fretboard && !g.children.length) {
        ["C", "D", "E", "F", "G", "A", "Am", "Dm", "Em", "Bm"].forEach(function (n) {
          var el = document.createElement("button");
          el.textContent = n;
          el.onclick = function () { send({ action: "chord", target: n }); };
          g.appendChild(el);
        });
        var box = document.createElement("div");
        box.className = "row"; box.style.gridColumn = "1 / -1";
        box.innerHTML = '<input type="text" id="chordname" placeholder="Any chord, e.g. F#m7" aria-label="Chord name" autocomplete="off"><button id="playchord">Play</button>';
        g.appendChild(box);
        $("playchord").onclick = function () { send({ action: "chord", target: $("chordname").value.trim() }); };
      }
      if (!g.children.length) {
        s.buttons.forEach(function (b) {
          var el = document.createElement("button");
          el.innerHTML = b.label + "<small>" + (b.chord || "unknown") + (b.confirmed ? "" : " - unconfirmed") + "</small>";
          el.onclick = function () { send({ action: "chord", target: b.label }); };
          g.appendChild(el);
        });
      }
      return api("GET", "/api/log");
    }).then(function (l) {
      $("log").textContent = l.log.map(function (e) { return e.line; }).join("\n");
      $("log").scrollTop = $("log").scrollHeight;
    }).catch(function (e) { say(e.message, true); });
  }

  $("connect").onclick = function () {
    token = $("token").value.trim();
    api("GET", "/api/status").then(function () {
      $("login").hidden = true; $("app").hidden = false;
      refresh(); timer = setInterval(refresh, 2000);
    }).catch(function (e) { say(e.message === "missing or wrong token" ? "Wrong token." : e.message, true); });
  };
  $("token").addEventListener("keydown", function (e) { if (e.key === "Enter") $("connect").click(); });

  $("stop").onclick = function () { send({ action: "stop" }); };
  $("down").onclick = function () { send({ action: "strum", direction: "D" }); };
  $("up").onclick = function () { send({ action: "strum", direction: "U" }); };
  $("releaseAll").onclick = function () { send({ action: "release", target: "ALL" }); };
  $("play").onclick = function () {
    send({ action: "sequence", targets: $("seq").value.trim().split(/\s+/).filter(Boolean), bpm: parseInt($("bpm").value, 10) });
  };
})();
</script>
</body>
</html>
