<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#120e0a">
<title>AGAP Stage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2.5c6.6 0 11.5 3.2 11.5 9.6 0 8.4-8.4 17.4-11.5 17.4S4.5 20.5 4.5 12.1C4.5 5.7 9.4 2.5 16 2.5z' fill='%23d9a441'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <path class="pick" d="M24 3c8.2 0 14.5 4 14.5 12 0 10.5-10.5 23-14.5 23S9.5 25.5 9.5 15C9.5 7 15.8 3 24 3z"/>
      <path class="wave" d="M3 24c2.5-6 4.5 6 7 0M45 24c-2.5-6-4.5 6-7 0"/>
      <path class="wave" d="M18 17v10M24 13v18M30 17v10"/>
    </svg>
    <div>
      <h1>AGAP</h1>
      <p class="tag">Automated Guitar Player</p>
    </div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">
    <span class="led" id="led" data-state="offline"></span>
    <span id="statusText">Not connected</span>
    <button class="link" id="disconnect" hidden>Disconnect</button>
  </div>
</header>

<main>
  <section id="login" class="card pass" aria-labelledby="passH">
    <h2 id="passH" class="eyebrow">Backstage pass</h2>
    <p class="lead">Paste the token the bridge printed when it started.</p>
    <div class="row">
      <input type="password" id="token" placeholder="Token" aria-label="Bridge token" autocomplete="off" spellcheck="false">
      <button class="btn primary" id="connect">Connect</button>
    </div>
    <p class="hint err" id="loginError" role="alert" hidden></p>
  </section>

  <div id="app" hidden>
    <div class="banner" id="banner" role="alert" hidden></div>

    <section class="card stage" aria-labelledby="nowH">
      <h2 id="nowH" class="eyebrow">Now playing</h2>
      <div class="stage-grid">
        <div class="readout">
          <div class="chord-name" id="chordName" aria-live="polite">&ndash;</div>
          <div class="chord-meta" id="chordMeta">Pick a chord to begin.</div>
          <div class="eq" id="eq" aria-hidden="true"></div>
        </div>
        <svg class="board" id="board" viewBox="0 0 220 262" role="img" aria-label="Fretboard diagram of the current chord"></svg>
      </div>
      <div class="actions">
        <button class="btn big" id="down" data-action="strum"><span class="ico" aria-hidden="true">&darr;</span> Strum down</button>
        <button class="btn big" id="up" data-action="strum"><span class="ico" aria-hidden="true">&uarr;</span> Strum up</button>
      </div>
    </section>

    <section class="card" aria-labelledby="libH">
      <h2 id="libH">Chords</h2>
      <div class="tabs" id="tabs" role="tablist" aria-label="Chord families"></div>
      <div class="keys" id="keys"></div>
      <div class="any" id="any">
        <input type="text" id="chordname" placeholder="Any chord, e.g. F#m7" aria-label="Chord name" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="11">
        <button class="btn" id="playchord" data-action="chord">Play</button>
      </div>
      <p class="hint err" id="chordError" role="alert" hidden></p>
    </section>

    <section class="card" aria-labelledby="setH">
      <h2 id="setH">Setlist</h2>
      <div class="presets" id="presets" aria-label="Preset progressions"></div>
      <div class="row">
        <input type="text" id="seq" value="C G Am F" aria-label="Chords separated by spaces" autocomplete="off" spellcheck="false">
      </div>
      <div class="chips" id="chips" aria-label="Progression"></div>
      <p class="hint err" id="seqError" role="alert" hidden></p>
      <div class="tempo">
        <label for="bpm">Tempo</label>
        <input type="range" id="bpm" min="20" max="200" value="50" aria-label="Beats per minute">
        <output id="bpmOut" for="bpm">50 bpm</output>
        <span class="metro" id="metro" aria-hidden="true"></span>
      </div>
      <div class="actions">
        <button class="btn primary big" id="play" data-action="sequence"><span class="ico" aria-hidden="true">&#9654;</span> Play progression</button>
        <button class="btn ghost big" id="releaseAll" data-action="release">Release all</button>
      </div>
    </section>

    <details class="card log">
      <summary>Backstage log</summary>
      <pre id="log" aria-live="off"></pre>
    </details>
  </div>
</main>

<div class="stopbar" id="stopbar" hidden>
  <button id="stop" aria-label="Emergency stop: release everything and silence the strings">
    <span class="stop-dot" aria-hidden="true"></span>
    <span class="stop-word">STOP</span>
    <span class="stop-sub">release everything &middot; Esc</span>
  </button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/ui_logic.js"></script>
<script src="/app.js"></script>
</body>
</html>
