name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-logic-tests:
    name: Firmware logic tests (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash AGAP_HelperButton/tests/run_tests.sh

  control-tool-tests:
    name: Control tool logic tests (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/tests/run_tests.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: G-code inspector and LH fit checker tests
        run: python -m unittest test_hvs_inspect test_lh_fit test_deck_drawing test_stl_inspect -v
        working-directory: tools/tests

  fretboard-tests:
    name: Fretboard logic + chord search vs ChordAI (g++, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash AGAP_Fretboard/tests/run_tests.sh

  launcher-tests:
    name: Launcher tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  chordai-tests:
    name: ChordAI tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest test_chord_ai -v
        working-directory: ChordAI

  chordai-web-parity:
    name: ChordAI web page matches Python (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compare JavaScript solver with Python solver
        working-directory: ChordAI/web
        run: |
          python dump_python_results.py > expected.json
          node parity_test.js expected.json

  bridge-tests:
    name: Remote bridge tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest test_agap_bridge -v
        working-directory: bridge

  firmware-compile:
    name: Compile sketches for Arduino Mega 2560
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and Servo library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo
      - name: Compile AGAP_HelperButton
        run: arduino-cli compile --fqbn arduino:avr:mega AGAP_HelperButton
      - name: Compile AGAP_Fretboard
        run: arduino-cli compile --fqbn arduino:avr:mega AGAP_Fretboard
      - name: Compile AGAP_Mega
        run: arduino-cli compile --fqbn arduino:avr:mega AGAP_Mega

  control-tool-build:
    name: Build Windows control tool (g++)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build agap_control.cpp
        shell: bash
        run: g++ -std=c++14 -Wall -Wextra -O2 tools/agap_control.cpp -o tools/agap_control.exe
