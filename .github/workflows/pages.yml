name: Deploy ChordAI web page

# Deploys on every push that changes the page, and can be run by hand.
# configure-pages tries to switch Pages on by itself (enablement: true); if
# that is refused, set repo Settings -> Pages -> Source: "GitHub Actions"
# once and re-run.
on:
  push:
    branches: [main]
    paths:
      - "ChordAI/web/index.html"
      - "ChordAI/web/chord_ai.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Keep only the files the page needs
        run: |
          mkdir site
          cp ChordAI/web/index.html ChordAI/web/chord_ai.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
